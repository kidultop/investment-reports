name: Daily Investment Morning Brief

on:
  schedule:
    # 00:00 UTC = 08:15 SGT (UTC+8), 每周一至周六自动运行
    # 第一梯队：00:15 UTC = 08:15 SGT，避开整点大拥堵
    - cron: '15 0 * * 1-6'
    # 第二梯队（兜底重试）：00:45 UTC = 08:45 SGT
    - cron: '45 0 * * 1-6'
    # 第三梯队（二次重试）：01:15 UTC = 09:15 SGT
    - cron: '15 1 * * 1-6'
  workflow_dispatch: # 支持在 GitHub 网页端或手机 GitHub App 上随时点击一键手动触发

permissions:
  contents: write

concurrency:
  group: "report-generation"
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run daily investment report pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
        run: |
          python3 scripts/run_cloud_report.py

      - name: Commit and push to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_report_*.html index.html
          if git diff --staged --quiet; then
            echo "无文件变更，跳过提交"
          else
            git commit -m "report: $(date +'%Y-%m-%d') 早报 Morning [cloud-automated]"
            git pull --rebase origin main || true
            git push origin main
          fi
